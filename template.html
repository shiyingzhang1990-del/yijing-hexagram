<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#b03a2e">
<meta name="description" content="六十四卦 · 抽三张解卦 —— 翻开三张卦牌，观本卦·互卦·变卦，参悟所问之事。">
<title>六十四卦 · 抽三张解卦</title>
<style>
:root{
  --paper:#f7f1e3; --paper2:#efe6cf; --ink:#2b231a; --sub:#7a6a55;
  --line:#e4d8bf; --cinnabar:#b03a2e; --cinnabar2:#8f2f24;
  --gold:#b8923a; --gold-soft:#f3e6c4;
  --radius:16px;
  --shadow:0 1px 3px rgba(60,45,20,.08),0 4px 16px rgba(60,45,20,.06);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); background:var(--paper); color:var(--ink);
  font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 15% 10%, rgba(184,146,58,.05), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(176,58,46,.04), transparent 40%);
}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 120px}

/* header */
header{position:sticky;top:0;z-index:60;background:rgba(247,241,227,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px 10px}
.brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand .tri{font-size:22px;color:var(--cinnabar)}
.brand h1{font-family:var(--serif);font-size:20px;margin:0;letter-spacing:1px;font-weight:800}
.brand .en{font-size:12px;color:var(--sub);letter-spacing:2px}
header .sub{font-size:12.5px;color:var(--sub);margin:4px 0 10px}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;text-decoration:none;border:1px solid var(--line);background:#fbf6ea;
  color:var(--sub);padding:6px 13px;border-radius:999px;font-size:13px;white-space:nowrap}
.nav a.on{background:var(--ink);border-color:var(--ink);color:#f7f1e3;font-weight:600}

/* hero */
.hero{text-align:center;padding:32px 8px 6px}
.hero .bagua{font-size:38px;letter-spacing:5px;color:var(--gold);margin-bottom:8px}
.hero h2{font-family:var(--serif);font-size:28px;margin:0 0 10px;letter-spacing:2px}
.hero p.lead{font-size:15px;color:var(--sub);max-width:560px;margin:0 auto 4px}
.hero p.sub{font-size:12.5px;color:var(--sub);opacity:.85;margin:0 auto 6px}

/* board */
.board{margin-top:24px}
.board-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.board-count{font-size:14px;color:var(--sub);font-weight:600}
.board-count b{color:var(--cinnabar);font-size:18px}
.board-hint{font-size:12.5px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:9px}
@media(max-width:560px){.grid{grid-template-columns:repeat(4,1fr);gap:7px}}

/* flip card */
.hx{aspect-ratio:3/4;perspective:900px;cursor:pointer}
.hx-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.hx.flipped .hx-inner{transform:rotateY(180deg)}
.hx-face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.hx-back{background:linear-gradient(160deg,#c9a24a,#b03a2e);box-shadow:var(--shadow);
  border:1px solid rgba(120,80,20,.25)}
.hx-back .taiji{font-size:26px;color:rgba(255,255,255,.92);filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
.hx-back .zi{font-size:11px;color:rgba(255,248,235,.9);letter-spacing:2px;margin-top:2px;font-weight:600}
.hx-front{transform:rotateY(180deg);background:#fffdf6;border:1px solid var(--line);box-shadow:var(--shadow)}
.hx-front .sym{font-size:30px;color:var(--cinnabar);line-height:1}
.hx-front .nm{font-family:var(--serif);font-size:14px;font-weight:700;margin-top:4px;letter-spacing:1px}
.hx-front .no{font-size:9px;color:var(--sub);margin-top:1px}

/* actions */
.actions{text-align:center;margin-top:20px;display:none}
.actions.show{display:block;animation:fade .4s ease}
.btn{display:inline-block;border:none;cursor:pointer;border-radius:999px;font-size:15px;font-weight:700;
  padding:12px 30px;font-family:var(--sans);letter-spacing:1px}
.btn-primary{background:var(--cinnabar);color:#f7f1e3;box-shadow:var(--shadow)}
.btn-primary:hover{background:var(--cinnabar2)}
.btn-ghost{background:#fffdf6;color:var(--ink);border:1px solid var(--line);margin-left:10px}
.btn-ghost:hover{border-color:var(--gold)}

/* result */
#result{display:none;margin-top:34px}
#result.show{display:block;animation:fade .5s ease}
.res-head{text-align:center;margin-bottom:6px}
.res-head h3{font-family:var(--serif);font-size:24px;margin:0;letter-spacing:2px}
.res-head .synth{margin:12px auto 0;max-width:600px;font-size:14px;color:var(--sub);
  background:var(--gold-soft);border:1px dashed var(--gold);border-radius:12px;padding:12px 16px}
.res-head .synth b{color:var(--cinnabar)}

.gua{background:#fffdf6;border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-top:16px;overflow:hidden}
.gua-pos{display:flex;align-items:center;gap:10px;padding:12px 18px;color:#fff;background:var(--cinnabar)}
.gua-pos .pk{font-size:13px;font-weight:700;letter-spacing:1px}
.gua-pos .pd{margin-left:auto;font-size:12px;opacity:.9;border:1px solid rgba(255,255,255,.4);
  border-radius:999px;padding:2px 11px}
.gua-body{padding:16px 18px 20px}
.gua-main{display:flex;align-items:center;gap:18px}
.lines{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.ln{height:11px;border-radius:3px}
.ln-yang{width:56px;background:var(--ink)}
.ln-yin{width:56px;display:flex;gap:16px}
.ln-yin i{flex:1;height:11px;background:var(--ink);border-radius:3px}
.gua-id{flex:1;min-width:0}
.gua-id .nm{font-family:var(--serif);font-size:22px;font-weight:800;letter-spacing:1px}
.gua-id .py{font-size:12px;color:var(--sub);margin-left:6px;letter-spacing:1px}
.gua-id .full{font-size:13px;color:var(--sub);margin-top:2px}
.gua-id .theme{display:inline-block;margin-top:6px;font-size:12px;color:var(--cinnabar);
  border:1px solid #e2c9c3;background:#fbf1ef;border-radius:999px;padding:2px 11px}
.gua-txt{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.gua-txt .row{margin-bottom:9px;font-size:14.5px;text-align:justify}
.gua-txt .row .k{display:inline-block;font-size:12px;font-weight:800;color:var(--gold);
  letter-spacing:1px;margin-right:8px}
.gua-txt .row.gua-ci{color:#3a2f22}
.gua-txt .row.gua-ci .k{color:var(--cinnabar)}
.gua-txt .row.xiang{color:#5a4a34}
.gua-txt .row.mean{color:#3a2f22}
.gua-txt .row.mean .k{color:#2e6b5c}
.gua-txt .row b{color:var(--ink)}

/* how */
.how{margin-top:40px;background:#fffdf6;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.how h3{font-family:var(--serif);font-size:18px;margin:0 0 10px;letter-spacing:1px}
.how ol{margin:0;padding-left:20px;font-size:14px;color:#4a3d2c;line-height:1.9}
.how .note{font-size:12px;color:var(--sub);margin-top:12px;line-height:1.7}

.foot{text-align:center;color:var(--sub);font-size:12px;margin-top:36px;line-height:1.8}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <span class="tri">☯</span>
    <h1 id="h1"></h1>
  </div>
  <p class="sub" id="hsub"></p>
  <div class="nav" id="nav"></div>
</header>

<div class="hero">
  <div class="bagua" id="bagua"></div>
  <h2 id="heroTitle"></h2>
  <p class="lead" id="heroLead"></p>
  <p class="sub" id="heroSub"></p>
</div>

<div class="board" id="board">
  <div class="board-bar">
    <div class="board-count">已抽 <b id="cnt">0</b> / 3 张</div>
    <div class="board-hint">默念所问之事，任点三张卦牌</div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="actions" id="actions">
    <button class="btn btn-primary" id="revealBtn">解卦 · 参悟所问</button>
    <button class="btn btn-ghost" id="resetBtn">重新抽牌</button>
  </div>
</div>

<section id="result">
  <div class="res-head">
    <h3>解卦 · 三卦合参</h3>
    <div class="synth" id="synth"></div>
  </div>
  <div id="guaList"></div>
</section>

<div class="how" id="how">
  <h3>如何抽三张牌？</h3>
  <ol>
    <li><b>静心默念</b>你所关心的问题（事业、感情、抉择皆可）。</li>
    <li>六十四张卦牌牌面朝下，<b>凭直觉任点三张</b>翻开。</li>
    <li>第一张为<b>本卦</b>（当下之境），第二张为<b>互卦</b>（演进之势），第三张为<b>变卦</b>（最终之果）。</li>
    <li>参看三卦的卦辞、象曰与白话解读，寻得启发。</li>
  </ol>
  <p class="note">注：卦辞、象曰取自通行本《周易》原文；白话解读为编者所注，仅供参考与娱乐，不构成任何决策建议。</p>
</div>

<div class="foot" id="foot"></div>
</div>

<script>
const DATA = __DATA_JSON__;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// header / hero
$('#h1').textContent = DATA.title;
$('#hsub').textContent = DATA.subtitle;
$('#bagua').textContent = DATA.hero.bagua;
$('#heroTitle').textContent = DATA.hero.title;
$('#heroLead').textContent = DATA.hero.lead;
$('#heroSub').textContent = '卦辞、象曰取自《周易》原文 · 白话解读为编者所注';
$('#foot').textContent = DATA.foot;

$('#nav').innerHTML =
  `<a href="#board" class="on" data-k="board">牌阵</a>` +
  `<a href="#result" data-k="result">解卦</a>` +
  `<a href="#how" data-k="how">说明</a>`;

// render grid
const grid = $('#grid');
grid.innerHTML = DATA.hexagrams.map((h,i)=>`
  <div class="hx" data-i="${i}">
    <div class="hx-inner">
      <div class="hx-face hx-back"><span class="taiji">☯</span><span class="zi">卦</span></div>
      <div class="hx-face hx-front"><span class="sym">${h.sym}</span><span class="nm">${esc(h.name)}</span><span class="no">${h.num}</span></div>
    </div>
  </div>`).join('');

const selected = [];
const cards = [...grid.querySelectorAll('.hx')];

function linesHtml(bin){
  return [...bin].reverse().map(c=> c==='1'
    ? '<div class="ln ln-yang"></div>'
    : '<div class="ln ln-yin"><i></i><i></i></div>').join('');
}

function updateCount(){
  $('#cnt').textContent = selected.length;
  if(selected.length >= 3){
    $('#actions').classList.add('show');
    grid.style.pointerEvents = 'none';
  }
}

cards.forEach((c,i)=>{
  c.addEventListener('click', ()=>{
    if(c.classList.contains('flipped') || selected.length >= 3) return;
    c.classList.add('flipped');
    selected.push(DATA.hexagrams[i]);
    updateCount();
  });
});

$('#revealBtn').addEventListener('click', reveal);
$('#resetBtn').addEventListener('click', ()=>{
  selected.length = 0;
  cards.forEach(c=>c.classList.remove('flipped'));
  grid.style.pointerEvents = '';
  $('#actions').classList.remove('show');
  $('#result').classList.remove('show');
  updateCount();
  window.scrollTo({top:0, behavior:'smooth'});
});

const POS = [
  {p: DATA.hero.pos1, d: DATA.hero.pos1d},
  {p: DATA.hero.pos2, d: DATA.hero.pos2d},
  {p: DATA.hero.pos3, d: DATA.hero.pos3d},
];

function reveal(){
  if(selected.length < 3) return;
  const [a,b,c] = selected;
  $('#synth').innerHTML =
    `三卦合参：本卦「<b>${esc(a.name)}</b>」主 <b>${esc(a.theme)}</b>，互卦「<b>${esc(b.name)}</b>」主 <b>${esc(b.theme)}</b>，变卦「<b>${esc(c.name)}</b>」主 <b>${esc(c.theme)}</b>。`;
  $('#guaList').innerHTML = selected.map((h,idx)=>{
    const pos = POS[idx];
    return `<div class="gua">
      <div class="gua-pos"><span class="pk">${esc(pos.p)}</span><span class="pd">${esc(pos.d)}</span></div>
      <div class="gua-body">
        <div class="gua-main">
          <div class="lines">${linesHtml(h.binary)}</div>
          <div class="gua-id">
            <div class="nm">${esc(h.name)}<span class="py">${esc(h.py)}</span></div>
            <div class="full">${esc(h.full)} · 第 ${h.num} 卦</div>
            <span class="theme">${esc(h.theme)}</span>
          </div>
        </div>
        <div class="gua-txt">
          <div class="row gua-ci"><span class="k">卦辞</span>${esc(h.judgment)}</div>
          <div class="row xiang"><span class="k">象曰</span>${esc(h.image)}</div>
          <div class="row mean"><span class="k">解</span>${esc(h.meaning)}</div>
        </div>
      </div>
    </div>`;
  }).join('');
  $('#result').classList.add('show');
  setTimeout(()=>$('#result').scrollIntoView({behavior:'smooth', block:'start'}), 60);
}

// scroll-spy
const navLinks = [...document.querySelectorAll('#nav a')];
const spy = new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(e.isIntersecting){
      navLinks.forEach(a=>a.classList.toggle('on', a.dataset.k===e.target.id));
    }
  });
},{rootMargin:'-20% 0px -70% 0px'});
['board','result','how'].forEach(id=>{const el=document.getElementById(id); if(el) spy.observe(el);});
</script>
</body>
</html>
